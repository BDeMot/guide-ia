# File de travail de la veille : ce qui a été repéré mais pas encore traité.
# Tenu par la skill /sources.
#
# publications : publications repérées mais pas encore lues, ou à réexaminer.
#   /veille les traite en priorité, puis les retire de la file (vers le
#   corpus ou vers veille/ecartees.yml).
#   Champs : url, titre, source, raison (chapitre visé et intérêt),
#            ajoute_le (AAAA-MM-JJ), origine.
#
# auteurs : auteurs ou équipes proposés comme nouvelles références.
#   /auteurs les évalue, puis les retire de la file (vers veille/sources.yml
#   ou vers la section « refuses »).
#   Champs : nom, pourquoi, chapitres, ajoute_le, origine.
#
# refuses : auteurs évalués et non retenus, avec la raison, pour ne pas les
#   reproposer.

